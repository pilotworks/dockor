name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    name: Google Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - name: Run Release Please Action
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release-binaries:
    name: Build & Upload Release Binaries
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build Web UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Compile Multi-Platform Binaries
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist/packages
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X github.com/pilotworks/dockor/internal/version.Version=${TAG} -X github.com/pilotworks/dockor/internal/version.GitCommit=${COMMIT} -X github.com/pilotworks/dockor/internal/version.BuildDate=${BUILD_DATE}"

          TARGETS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          for TARGET in "${TARGETS[@]}"; do
            GOOS="${TARGET%%/*}"
            GOARCH="${TARGET##*/}"
            BIN_EXT=""
            if [ "$GOOS" = "windows" ]; then
              BIN_EXT=".exe"
            fi

            PKG_NAME="dockor_${TAG}_${GOOS}_${GOARCH}"
            STAGING_DIR="dist/${PKG_NAME}"
            mkdir -p "${STAGING_DIR}"

            echo "Compiling for ${GOOS}/${GOARCH}..."
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="${LDFLAGS}" -o "${STAGING_DIR}/dockor${BIN_EXT}" ./cmd/dockor
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="${LDFLAGS}" -o "${STAGING_DIR}/dockor-agent${BIN_EXT}" ./cmd/dockor-agent

            # Bundle templates, frontend assets, and documentation
            cp -r templates "${STAGING_DIR}/"
            mkdir -p "${STAGING_DIR}/web"
            cp -r web/dist "${STAGING_DIR}/web/"
            [ -f README.md ] && cp README.md "${STAGING_DIR}/"
            [ -f LICENSE ] && cp LICENSE "${STAGING_DIR}/"

            # Create archive
            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -rq "packages/${PKG_NAME}.zip" "${PKG_NAME}")
            else
              tar -czf "dist/packages/${PKG_NAME}.tar.gz" -C dist "${PKG_NAME}"
            fi
          done

      - name: Generate Checksums
        working-directory: dist/packages
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload Binaries to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "${TAG}" dist/packages/* --clobber

  build-push-docker:
    name: Build & Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
