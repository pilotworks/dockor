name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Frontend Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Frontend Dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: TypeScript Typecheck
        working-directory: web
        run: pnpm run typecheck

      - name: Build Frontend Production Assets
        working-directory: web
        run: pnpm run build

  backend-test:
    name: Backend Test & Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Go Modules
        run: go mod verify

      - name: Run Go Unit Tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Compile Dockor Binaries
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -v -ldflags="-s -w" -o bin/dockor ./cmd/dockor
          CGO_ENABLED=0 go build -v -ldflags="-s -w" -o bin/dockor-agent ./cmd/dockor-agent

  docker-build-test:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry-run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: dockor:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
